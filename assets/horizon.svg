<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">harnakam · Developer</title>
  <desc id="desc">Slow amber orbits and drifting points of light.</desc>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#D99954" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D99954" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="-245" y1="-80" x2="245" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEC69B" stop-opacity=".08"/>
      <stop offset=".48" stop-color="#EEC69B" stop-opacity=".65"/>
      <stop offset="1" stop-color="#EEC69B" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="500" rx="12"/></clipPath>
  </defs>
  <style>
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="#101114"/>
    <ellipse cx="902" cy="250" rx="380" ry="340" fill="url(#halo)"/>
    <g fill="#CBBBAD" opacity=".65">
      <circle cx="91" cy="100" r="1"/><circle cx="549" cy="77" r="1"/>
      <circle cx="681" cy="411" r="1"/><circle cx="1101" cy="93" r="1.2"/>
      <circle cx="1139" cy="392" r="1"/><circle cx="417" cy="402" r=".8"/>
      <circle cx="702" cy="106" r=".8"/><circle cx="1063" cy="451" r=".8"/>
    </g>
    <g transform="translate(902 250) rotate(-28)">
      <g stroke="url(#ring)" stroke-width="1">
        <ellipse rx="247" ry="88"/><ellipse rx="234" ry="126"/>
        <ellipse rx="212" ry="167"/><ellipse rx="179" ry="204"/>
        <ellipse rx="131" ry="232"/><ellipse rx="69" ry="247"/>
      </g>
      <g class="motion">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
          <ellipse rx="247" ry="88" stroke="#F0C798" stroke-opacity=".24"/>
        </g>
        <circle r="3.5" fill="#FFE0B4">
          <animateMotion dur="18s" repeatCount="indefinite" path="M247 0 A247 88 0 1 1 -247 0 A247 88 0 1 1 247 0"/>
        </circle>
        <circle r="2.5" fill="#F1C18A">
