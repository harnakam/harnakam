    <text x="66" y="245" fill="#F3EEE7" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="600" letter-spacing="-4">harnakam</text>
    <text x="71" y="292" fill="#CEB89E" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1">Developer</text>
    <path d="M72 429H1128" stroke="#F3EEE7" stroke-opacity=".12"/>
    <text x="72" y="460" fill="#ACA69D" font-family="Consolas, monospace" font-size="11" letter-spacing="2">HARNAKAM.COM</text>
    <path d="M1106 460 1118 448M1106 448H1118V460" stroke="#CEB89E" stroke-width="1.2"/>
