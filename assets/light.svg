    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e3c9a4" stop-opacity="0"/>
      <stop offset=".48" stop-color="#d4b58d" stop-opacity=".05"/>
      <stop offset=".85" stop-color="#ead7bc" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ead7bc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge">
